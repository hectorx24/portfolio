<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Héctor López — Founder &amp; Developer @ Aeterna Labs</title>
  <desc id="desc">Terminal profile card with Héctor López's background, mission and active products.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#c7a4f5"/>
      <stop offset="1" stop-color="#77c8f0"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#f78ca0"/>
      <stop offset="1" stop-color="#febe75"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="960" height="400" rx="18" fill="#17171c"/>
  <rect x="9" y="9" width="942" height="382" rx="13" fill="none" stroke="url(#sky)" stroke-width="2"/>
  
  <!-- Window Controls -->
  <circle cx="35" cy="35" r="5" fill="#f3a0b5"/>
  <circle cx="54" cy="35" r="5" fill="#f1d09a"/>
  <circle cx="73" cy="35" r="5" fill="#9de4d1"/>
  <text x="98" y="41" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.5">hectorx24  ·  aeterna labs  ·  online</text>
  <path d="M29 58H931" stroke="#343441"/>

  <!-- Left Main Shell Panel -->
  <rect x="29" y="76" width="604" height="298" rx="9" fill="#1d1d23" stroke="#b99af0" stroke-width="1.5"/>
  
  <!-- whoami section -->
  <text x="48" y="107" fill="#76d8d2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">❯ whoami</text>
  <text x="48" y="137" fill="#f0e6f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600">hector_lopez</text>
  <text x="180" y="137" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">—</text>
  <text x="202" y="137" fill="#f78ca0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Founder &amp; Developer</text>

  <path d="M48 155H615" stroke="#343441"/>
  
  <text x="48" y="180" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">studio:</text>
  <text x="135" y="180" fill="#c7a4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">Aeterna Labs</text>
  <text x="260" y="180" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">[Est. 2025 · Sonora, Mexico]</text>

  <text x="48" y="206" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">focus:</text>
  <text x="135" y="206" fill="#9de4d1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">AI Products · Experimental UIs · TV Systems</text>

  <path d="M48 226H615" stroke="#343441"/>

  <!-- ls products/ section -->
  <text x="48" y="254" fill="#76d8d2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">❯ ls products/ --active</text>
  
  <text x="48" y="282" fill="#f78ca0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">aura/</text>
  <text x="175" y="282" fill="#b8b9ca" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">AI Dream Journal · longitudinal memory</text>

  <text x="48" y="306" fill="#f78ca0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">deep-rpg/</text>
  <text x="175" y="306" fill="#b8b9ca" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">AI Game Master · CLI / D20 engine</text>

  <text x="48" y="330" fill="#f78ca0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">dualmind/</text>
  <text x="175" y="330" fill="#b8b9ca" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Focus &amp; execution · microstep planning</text>

  <text x="48" y="354" fill="#f78ca0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">creator-tv/</text>
  <text x="175" y="354" fill="#b8b9ca" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Google TV / Android TV open source client</text>

  <!-- Right Visual Status Panel -->
  <rect x="651" y="76" width="280" height="298" rx="9" fill="#1d1d23" stroke="#b99af0" stroke-width="1.5"/>
  <text x="674" y="107" fill="#f3d29b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">aeterna runtime</text>
  
  <!-- Retro Sunset & Horizon Wave -->
  <circle cx="791" cy="195" r="52" fill="url(#sunset)" opacity=".95"/>
  <path d="M674 195H908M674 209H908M674 223H908M674 237H908M674 251H908" stroke="#1d1d23" stroke-width="4.5" opacity=".95"/>
  <path d="M674 270C711 240 746 296 785 265S861 242 908 274" fill="none" stroke="#76d8d2" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M674 286C716 256 746 312 789 281S862 262 908 290" fill="none" stroke="#c7a4f5" stroke-width="2"/>

  <!-- Footer Telemetry in Right Panel -->
  <text x="674" y="330" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">status: independent</text>
  <text x="674" y="352" fill="#76d8d2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">runtime: shipping products</text>
</svg>
